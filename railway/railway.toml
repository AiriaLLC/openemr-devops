# Railway deployment configuration for OpenEMR
# https://docs.railway.app/reference/config-as-code

[build]
dockerfilePath = "railway/Dockerfile"

[deploy]
# Single replica for database consistency
numReplicas = 1

# Restart on failure with limited retries
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Health check - OpenEMR takes time to initialize
# Configure via Railway dashboard after first successful boot:
#   Path: /
#   Timeout: 300 seconds
